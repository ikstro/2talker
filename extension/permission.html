<!DOCTYPE html>

<head>

<style>
  body { width: auto; max-width: 520px; margin: 48px auto; padding: 0 16px; }
  h1 { font-size: 20px; color: var(--strong); }

<body>
<h1>Allow the microphone</h1>
<p>Altype records your voice as a track of its own, so the transcript shows where you spoke and where the others did. The sound never leaves this computer: Altype transcribes it here.</p>
<p><button id="allow">Allow the microphone</button></p>
<p id="result" class="muted"></p>
<script src="permission.js"></script>
</body>
