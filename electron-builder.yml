# Windows installer: npm run dist → release/Altype-Setup-<version>.exe
# The id of 2Talker, the app's first name: Altype installs over it, and updates it.
appId: com.ikstro.2talker
productName: Altype
copyright: Copyright © 2026 Yevhen Peshynskyi
directories:
  output: release
  buildResources: build
files:
  - package.json
  - LICENSE
  - NOTICE
  - dist/**
  - "!dist/**/*.map"
  - media/**
  - vendor/**
  # The speech engine's source (a few hundred KB): Python runs it from disk, from
  # an environment installed outside the app (src/speechpack.ts). The extension
  # is a folder Chrome loads unpacked.
  - engine/*.py
  - engine/models.json
  - engine/calibration/**
  - engine/pyproject.toml
  - engine/uv.lock
  - extension/**
# The translator and the voice run as a thread and a process of their own and
# read the engine from disk: they live outside the archive. So does the
# keyboard thread, with koffi, which it loads from beside it.
asarUnpack:
  - dist/mt-worker.js
  - dist/voice-worker.js
  - dist/kbd-worker.js
  - node_modules/koffi/**
  - vendor/**
  - engine/**
  - extension/**
# koffi ships prebuilt for Node-API; nothing to rebuild for Electron.
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  artifactName: Altype-Setup-${version}.${ext}
  # Uninstall asks whether the data goes too (build/installer.nsh); an update keeps it.
  include: build/installer.nsh
# Releases on GitHub: the updater (src/update.ts) reads latest.yml from there.
# The installer is not signed (a free app): Windows warns once at install.
publish:
  provider: github
  owner: ikstro
  repo: altype
