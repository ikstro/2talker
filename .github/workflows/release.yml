# A tag v<version> (matching package.json) builds the Windows installer and
# publishes it as a GitHub release with latest.yml, which installed copies
# read to update themselves (src/update.ts).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      # The speech engine's tests, on its core part (no card, no speakers).
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.0'
      - run: uv sync --frozen --group dev
        working-directory: engine
      - run: npm run test:engine
      # The draft release is made first: electron-builder uploads its files
      # in parallel and, finding none, would make a draft for each of them.
      - run: gh release view "$env:TAG" --json id > $null 2>&1; if (-not $?) { gh release create "$env:TAG" --draft --title "Altype $($env:TAG.Substring(1))" --notes-file .github/release-notes.md }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
      - run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: gh release edit "$env:TAG" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
